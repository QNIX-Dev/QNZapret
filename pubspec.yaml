name: qnzapret
description: "Cross-platform frontend shell for the QNZapret client."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_riverpod: ^3.3.1
  shared_preferences: ^2.5.5
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon/qnzapret_app_icon_source.png
    - assets/branding/logo/qnzapret_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/app_icon/qnzapret_app_icon_source.png
  min_sdk_android: 21
  windows:
    generate: true
    image_path: assets/branding/app_icon/qnzapret_app_icon_source.png
    icon_size: 256
