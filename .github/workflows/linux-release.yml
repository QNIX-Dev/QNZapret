name: Linux bundle and package checks

on:
  pull_request:
    paths:
      - "lib/**"
      - "linux/**"
      - "runtime/**"
      - "packaging/linux/**"
      - "docs/linux_*.md"
  workflow_dispatch:

jobs:
  debian-bundle:
    runs-on: ubuntu-latest
    container: debian:12
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            ca-certificates clang cmake git libgtk-3-dev liblzma-dev lld llvm \
            ninja-build pkg-config
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - run: ctest --test-dir build/linux/x64/release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: debian12-linux-bundle
          path: build/linux/x64/release/bundle

  fedora-package:
    runs-on: ubuntu-latest
    needs: debian-bundle
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debian12-linux-bundle
          path: build/linux/x64/release/bundle
      - run: dnf install -y bash rpm-build rpmdevtools tar xz
      - name: Package smoke
        run: |
          test -x build/linux/x64/release/bundle/qnzapret
          bash packaging/linux/build_packages.sh
          rpm -qpl build/linux/packages/*.rpm
